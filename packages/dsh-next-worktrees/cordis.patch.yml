# bundle patch for the worktrees plugin: inserts its plugin row into the profile
# roster. Applied as a profile bundle layer (the `dsh.bundle.patch` manifest
# field); install with
# `dsh plugin --profile <name> add link:<repo>/packages/dsh-next-worktrees`.
- insert:
    - id: dsh-next-worktrees
      name: '@dsh-next/dsh-next-worktrees'

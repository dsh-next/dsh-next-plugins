name: Canary

# On-demand prerelease publishing from main after same-SHA keyless CI passes.
# Snapshot versioning changes runner manifests and CHANGELOGs and consumes the
# runner's pending change files. None of those mutations are committed or pushed;
# the repository's pending changes remain available for the stable release.
# Publish only under canary, beta, or rc; never replace the stable latest tag.
# This lane creates no release PR, GitHub Release, or git tags.
#
# Requires the repository secret `NPM_TOKEN` (npm automation token for the
# @dsh-next scope).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: npm dist-tag for the prerelease
        type: choice
        required: true
        default: canary
        options:
          - canary
          - beta
          - rc

permissions:
  contents: read

concurrency:
  group: canary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validation:
    name: Validate publishing SHA
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    # No inherited secrets or live-model inputs; only the keyless CI gates run.

  canary:
    name: Publish canary prerelease
    if: github.ref == 'refs/heads/main'
    needs: validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ inputs.tag }}

    steps:
      # A choice control is not a security boundary: validate API input too,
      # before installing dependencies, configuring auth, or versioning files.
      - name: Validate prerelease tag
        shell: bash
        run: |
          case "$TAG" in
            canary|beta|rc) ;;
            *) printf '%s\n' 'Invalid prerelease tag: expected canary, beta, or rc.' >&2; exit 1 ;;
          esac

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:latest

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build packages
        run: pnpm build

      - name: Configure npm auth
        run: |
          printf '//registry.npmjs.org/:_authToken=%s\n' "${NPM_TOKEN}" > ~/.npmrc
          printf 'registry=https://registry.npmjs.org/\n' >> ~/.npmrc
          printf '@dsh-next:registry=https://registry.npmjs.org/\n' >> ~/.npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish canary snapshot
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Snapshot mutations and consumed change files stay on this runner.
          pnpm exec changeset version --snapshot "$TAG"
          pnpm exec changeset publish --tag "$TAG" --no-git-tag

# bundle patch for the git plugin: inserts its plugin row into the profile
# roster. Applied as a profile bundle layer (the `dsh.bundle.patch` manifest
# field); install with
# `dsh plugin --profile <name> add link:<repo>/packages/dsh-next-git`.
- insert:
    - id: dsh-next-git
      name: '@dsh-next/dsh-next-git'

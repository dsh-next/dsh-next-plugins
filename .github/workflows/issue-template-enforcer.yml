name: Enforce Issue Template

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

jobs:
  enforce:
    name: Close issues that skip the template
    runs-on: ubuntu-latest

    steps:
      - name: Check out trusted issue policy
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate issue template
        uses: actions/github-script@v8
        with:
          script: |
            const { pathToFileURL } = await import('node:url');
            const { enforceIssueTemplate } = await import(pathToFileURL(
              process.env.GITHUB_WORKSPACE + '/scripts/github-issue-policy.mjs'
            ).href);
            await enforceIssueTemplate({ github, context });

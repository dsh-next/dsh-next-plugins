# bundle patch for the telegram plugin: inserts its plugin row into the profile
# roster. Applied as a profile bundle layer (the `dsh.bundle.patch` manifest
# field); install with
# `dsh plugin --profile <name> add link:<repo>/packages/dsh-next-telegram`.
- insert:
    - id: dsh-next-telegram
      name: '@dsh-next/dsh-next-telegram'

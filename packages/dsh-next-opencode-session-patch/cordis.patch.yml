# bundle patch for the opencode-session-patch plugin: inserts its plugin row into the profile
# roster. Applied as a profile bundle layer (the `dsh.bundle.patch` manifest
# field); install with
# `dsh plugin --profile <name> add @dsh-next/dsh-next-opencode-session-patch`.
- insert:
    - id: dsh-next-opencode-session-patch
      name: '@dsh-next/dsh-next-opencode-session-patch'

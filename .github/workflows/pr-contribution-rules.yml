name: Enforce PR Contribution Rules

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  enforce:
    name: Validate PR contribution evidence
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    steps:
      # Privileged PR policies load only code from the trusted immutable base.
      - name: Checkout trusted policy source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Validate pull request body
        uses: actions/github-script@v8
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const policy = await import(pathToFileURL(process.env.GITHUB_WORKSPACE + '/scripts/github-pr-contribution.mjs').href);
            await policy.enforcePrContribution({ github, context, core });

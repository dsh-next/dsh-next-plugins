name: Release

# Changesets-driven publish pipeline. Every PR that touches a plugin adds a
# `.changeset/<id>.md` change file naming the affected packages and bump
# kinds. On push to main, this workflow runs `changeset version`, which bumps
# ONLY the packages named by pending change files, writes their CHANGELOGs,
# and opens (or updates) the "Version Packages" PR. Merging that PR is the
# release: a subsequent main push finds no pending change files and runs
# `changeset publish`, which publishes exactly the packages whose version is
# new to the registry and creates per-package GitHub Releases from the
# CHANGELOG entries.
#
# Requires the repository secret `NPM_TOKEN` (npm automation token for the
# @dsh-next scope) and repo settings "Allow GitHub Actions to create and
# approve pull requests".

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version and publish changed packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changesets_published: ${{ steps.changesets.outputs.published }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:latest

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Version packages and create/update the release PR
        id: changesets
        uses: changesets/action@v1
        with:
          title: Version Packages
          commit: "chore(version): release packages"
          version: pnpm exec changeset version
          publish: pnpm exec changeset publish
          create-github-releases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  verify-release:
    name: Post-publish mount smoke
    needs: release
    if: needs.release.outputs.changesets_published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install dsh CLI (pinned)
        run: npm install -g @deepseek-ai/dsh@0.1.1-rc.2

      - name: Build
        run: pnpm build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        timeout-minutes: 10
        run: pnpm exec playwright install chromium

      - name: Mount + headless-render smoke
        run: bash scripts/e2e-mount.sh

# bundle patch for the cron plugin: inserts its plugin row into the profile
# roster. Applied as a profile bundle layer (the `dsh.bundle.patch` manifest
# field); install with
# `dsh plugin --profile <name> add link:<repo>/packages/dsh-next-cron`.
- insert:
    - id: dsh-next-cron
      name: '@dsh-next/dsh-next-cron'

name: Release

# Changesets-driven publish pipeline. Every PR that touches a plugin adds a
# `.changeset/<id>.md` change file naming the affected packages and bump
# kinds. On push to main, this workflow runs `changeset version`, which bumps
# ONLY the packages named by pending change files, writes their CHANGELOGs,
# and opens (or updates) the "Version Packages" PR. Merging that PR is the
# release: a subsequent main push finds no pending change files and runs
# `changeset publish`, which publishes exactly the packages whose version is
# new to the registry and creates per-package GitHub Releases from the
# CHANGELOG entries.
#
# Git tags: `changesets/action` pushes a per-package tag (`name@version`, e.g.
# `@dsh-next/dsh-next-notifier@0.1.0`) whenever `create-github-releases` is
# true (its `push-git-tags` input is forced true in that case). This is
# intentional and additive: the tags power the GitHub Release compare/diff UI
# and are unambiguous (one tag per package version), unlike the old repo-wide
# `vX.Y.Z`. The release source of truth remains the npm registry version; tags
# are metadata, never edited, deleted, or used for versioning.
#
# Requires the repository secret `NPM_TOKEN` (npm automation token for the
# @dsh-next scope) and repo settings "Allow GitHub Actions to create and
# approve pull requests".

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version and publish changed packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changesets_published: ${{ steps.changesets.outputs.published }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:latest

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        # Version comes from package.json "packageManager"; do not pass
        # "version" here (avoid ERR_PNPM_BAD_PM_VERSION).

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Configure npm auth for @dsh-next
        run: |
          printf '//registry.npmjs.org/:_authToken=%s\n' "${NPM_TOKEN}" > ~/.npmrc
          printf 'registry=https://registry.npmjs.org/\n' >> ~/.npmrc
          printf '@dsh-next:registry=https://registry.npmjs.org/\n' >> ~/.npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Version packages and create/update the release PR
        id: changesets
        uses: changesets/action@v2.1.1
        with:
          pr-title: Version Packages
          commit-message: "chore(version): release packages"
          version-script: pnpm exec changeset version
          publish-script: pnpm exec changeset publish
          create-github-releases: true
          # Per-package `name@version` tags power the GitHub Release diff UI;
          # explicitly on (the action forces it true with releases anyway).
          push-git-tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  verify-release:
    name: Post-publish mount smoke
    needs: release
    if: needs.release.outputs.changesets_published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        # Version comes from package.json "packageManager"; do not pass
        # "version" here (avoid ERR_PNPM_BAD_PM_VERSION).

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install dsh CLI (pinned)
        run: npm install -g @deepseek-ai/dsh@0.1.1-rc.2

      - name: Build
        run: pnpm build

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        timeout-minutes: 10
        run: pnpm exec playwright install chromium

      - name: Mount + headless-render smoke
        run: bash scripts/e2e-mount.sh

# bundle patch for the workflows plugin: inserts its plugin row into the profile
# roster. Applied as a profile bundle layer (the `dsh.bundle.patch` manifest
# field); install with
# `dsh plugin --profile <name> add link:<repo>/packages/dsh-next-workflows`.
- insert:
    - id: dsh-next-workflows
      name: '@dsh-next/dsh-next-workflows'

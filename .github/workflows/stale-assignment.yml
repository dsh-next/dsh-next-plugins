name: Reassign stale PR assignments

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  sweep:
    name: Reassign stale PRs to the configured fallback
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out trusted assignment policy
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Reassign PRs with an inactive assignee
        uses: actions/github-script@v8
        with:
          script: |
            const { readFile } = await import('node:fs/promises');
            const { pathToFileURL } = await import('node:url');
            const workspace = process.env.GITHUB_WORKSPACE;
            const { sweepStaleAssignments } = await import(pathToFileURL(
              workspace + '/scripts/github-stale-assignment.mjs'
            ).href);
            const config = JSON.parse(await readFile(workspace + '/.github/pr-review-routes.json', 'utf8'));
            await sweepStaleAssignments({ github, context, core, config });

# bundle patch for the previews plugin: inserts its plugin row into the profile
# roster. Applied as a profile bundle layer (the `dsh.bundle.patch` manifest
# field); install with
# `dsh plugin --profile <name> add link:<repo>/packages/dsh-next-previews`.
- insert:
    - id: dsh-next-previews
      name: '@dsh-next/dsh-next-previews'

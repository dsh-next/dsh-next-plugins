# bundle patch for the reset plugin: inserts its plugin row into the profile
# roster. Applied as a profile bundle layer (the `dsh.bundle.patch` manifest
# field); install with
# `dsh plugin --profile <name> add @dsh-next/dsh-next-reset`.
- insert:
    - id: dsh-next-reset
      name: '@dsh-next/dsh-next-reset'

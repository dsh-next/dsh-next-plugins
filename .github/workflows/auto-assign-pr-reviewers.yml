name: Auto-assign PR reviewers

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  route:
    name: Route PR to category reviewers
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}

    steps:
      # Never check out or execute the PR head in this privileged workflow.
      - name: Check out trusted base routing policy
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Load routes and request reviewers
        uses: actions/github-script@v8
        with:
          script: |
            const { readFile } = await import('node:fs/promises');
            const { pathToFileURL } = await import('node:url');
            const workspace = process.env.GITHUB_WORKSPACE;
            const { routePullRequest } = await import(pathToFileURL(
              workspace + '/scripts/github-review-routing.mjs'
            ).href);
            // Config and helper come from the same immutable, trusted base SHA.
            let config;
            try {
              config = JSON.parse(await readFile(workspace + '/.github/pr-review-routes.json', 'utf8'));
              if (!Array.isArray(config.routes)) throw new Error('routes must be an array');
            } catch (error) {
              core.warning('review routing config unavailable, skipping: ' + error.message);
              return;
            }
            await routePullRequest({ github, context, core, config });

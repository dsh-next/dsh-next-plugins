packages:
  - 'shared'
  - 'packages/*'

# SDK peers resolve at runtime from the DSH profile tree, not from this repo's
# install; no automatic peer installation.
autoInstallPeers: false

# The 0.1.7 UI primitives bundle imports these packages but omits them from
# its manifest. Make its runtime dependencies explicit in the virtual store.
packageExtensions:
  '@deepseek-ai/dsh-client-ui-primitives@0.1.7-rc.1':
    dependencies:
      clsx: 2.1.1
      '@shikijs/langs': 4.4.3
      shiki: 4.4.3
      anser: 2.3.5
      mdast-util-from-markdown: 2.0.3
      mdast-util-gfm: 3.1.0
      mdast-util-math: 3.0.0
      micromark-extension-gfm: 3.0.0
      micromark-extension-math: 3.1.0
      micromark-core-commonmark: 2.0.3
      micromark-util-classify-character: 2.0.1
      micromark-factory-space: 2.0.1
      katex: 0.16.47

# Tests and builds must not install or purge dependencies implicitly.
# Run pnpm install explicitly when the dependency state is stale.
verifyDepsBeforeRun: error

# Pin the virtual-store layout: without it, `pnpm install` records one value
# and the `verifyDepsBeforeRun` check resolves another, so every script fails
# with "the value of the enableGlobalVirtualStore setting has changed".
virtualStoreType: project

allowBuilds:
  # The cloudflared postinstall downloads the platform binary (the auto-tunnel
  # feature ships its own tunnel client — users install nothing).
  # Transitive of @earendil-works/pi-ai; we do not need their postinstall.
  '@google/genai': false
  cloudflared: true
  cpu-features: true
  esbuild: true
  node-pty: true
  protobufjs: false
  ssh2: true

minimumReleaseAgeExclude:
  - '@deepseek-ai/dsh-agent@0.1.2-rc.1'
  - '@deepseek-ai/dsh-brand@0.1.2-rc.1 || 0.1.3-alpha.2 || 0.1.5-rc.1 || 0.1.6-alpha.2'
  - '@deepseek-ai/dsh-client-locale@0.1.2-rc.1 || 0.1.3-alpha.2 || 0.1.6-alpha.2'
  - '@deepseek-ai/dsh-client-ui-settings-plugins@0.1.2-rc.1'
  - '@deepseek-ai/dsh-client-ui-slots@0.1.2-rc.1 || 0.1.3-alpha.2 || 0.1.6-alpha.2'
  - '@deepseek-ai/dsh-commands@0.1.2-rc.1'
  - '@deepseek-ai/dsh-goal@0.1.2-rc.1'
  - '@deepseek-ai/dsh-llm@0.1.2-rc.1 || 0.1.3-alpha.2 || 0.1.5-rc.1 || 0.1.6-alpha.2'
  - '@deepseek-ai/dsh-session@0.1.2-rc.1 || 0.1.6-alpha.2'
  - '@deepseek-ai/dsh-settings@0.1.2-rc.1 || 0.1.3-alpha.2 || 0.1.5-rc.1'
  - '@deepseek-ai/dsh-skill@0.1.2-rc.1'
  - '@deepseek-ai/dsh-subagent@0.1.2-rc.1'
  - '@deepseek-ai/dsh-subprocess@0.1.2-rc.1'
  - '@deepseek-ai/dsh-timeout@0.1.2-rc.1 || 0.1.3-alpha.2 || 0.1.5-rc.1 || 0.1.6-alpha.2'
  - '@deepseek-ai/dsh-tools@0.1.2-rc.1'
  - '@deepseek-ai/dsh-typert-protocol@0.1.2-rc.1 || 0.1.3-alpha.2 || 0.1.5-rc.1 || 0.1.6-alpha.2'
  - '@deepseek-ai/dsh-user-approval@0.1.2-rc.1'
  - '@deepseek-ai/dsh-sandbox-policy@0.1.2-rc.1'
  - '@deepseek-ai/dsh-session-title@0.1.2-rc.1'
  - '@deepseek-ai/dsh-api-session-controller@0.1.2-rc.1'

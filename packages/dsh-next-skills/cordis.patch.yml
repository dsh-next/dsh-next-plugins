# bundle patch for the skills plugin: inserts its plugin row into the profile
# roster. Applied as a profile bundle layer (the `dsh.bundle.patch` manifest
# field); install with
# `dsh plugin --profile <name> add link:<repo>/packages/dsh-next-skills`.
- insert:
    - id: dsh-next-skills
      name: '@dsh-next/dsh-next-skills'

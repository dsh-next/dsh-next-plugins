# bundle patch for the decisions plugin: inserts its plugin row into the profile
# roster. Applied as a profile bundle layer (the `dsh.bundle.patch` manifest
# field); install with
# `dsh plugin --profile <name> add @dsh-next/dsh-next-decisions`.
- insert:
    - id: dsh-next-decisions
      name: '@dsh-next/dsh-next-decisions'

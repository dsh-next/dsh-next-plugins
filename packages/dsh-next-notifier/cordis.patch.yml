# bundle patch for the notifier plugin: inserts its plugin row into the profile
# roster. Applied as a profile bundle layer (the `dsh.bundle.patch` manifest
# field); install with
# `dsh plugin --profile <name> add link:<repo>/packages/dsh-next-notifier`.
- insert:
    - id: dsh-next-notifier
      name: '@dsh-next/dsh-next-notifier'

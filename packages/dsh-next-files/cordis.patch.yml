# bundle patch for the files plugin: inserts its plugin row into the profile
# roster. Applied as a profile bundle layer (the `dsh.bundle.patch` manifest
# field); install with
# `dsh plugin --profile <name> add link:<repo>/packages/dsh-next-files`.
- insert:
    - id: dsh-next-files
      name: '@dsh-next/dsh-next-files'

name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      live_checkpoints:
        description: Run the opt-in live-model checkpoint test (spends credits)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The changeset gate diffs against origin/main; a shallow clone must
          # still carry that ref.
          fetch-depth: 0

      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:latest

      # Per-package versioning: source changes to a publishable plugin must be
      # accompanied by a .changeset/<id>.md change file naming that package.
      # Skipped on pushes to main (the Version Packages merge carries version
      # bumps, and release.yml owns publishing); enforced on PRs where the
      # change file belongs.
      - name: Verify changeset accompanies plugin changes
        if: github.event_name == 'pull_request'
        run: node scripts/verify-changeset.mjs --base origin/main

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        # Version comes from the root package.json "packageManager" field; do
        # not also pass "version" here or the action errors with
        # ERR_PNPM_BAD_PM_VERSION (two sources of truth).

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # The ordered check command explicitly builds after unit/script tests.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Ordered static checks (including script tests)
        run: pnpm run check

      - name: No emoji rule (source code only)
        run: |
          # Narrowed scope: enforce no-emoji only in git-tracked SOURCE code
          # (*.ts/.tsx/.js/.mjs/.cjs and shell scripts), matching AGENTS.md.
          # Docs prose, Agent Notes, READMEs, vendored skills, and quoted
          # product-output strings are exempt. Scanning `git ls-files` (not a
          # filesystem walk) also keeps gitignored and untracked files out of
          # scope (e.g. .pnpm-store cache, untracked vendored skills).
          git ls-files -z | python3 -c '
          import sys, pathlib
          ranges = [
              (0x1F000, 0x1FAFF),
              (0x2600, 0x27BF),
              (0x2B00, 0x2BFF),
              (0x1F1E6, 0x1F1FF),
          ]
          singles = {0xFE0F, 0x200D}
          src_suffixes = {".ts", ".tsx", ".js", ".jsx", ".mjs", ".cjs", ".mts", ".cts", ".sh"}
          bad = []
          for entry in sys.stdin.buffer.read().split(b"\0"):
              p = entry.decode("utf-8")
              if not p:
                  continue
              if pathlib.Path(p).suffix.lower() not in src_suffixes:
                  continue
              try:
                  text = pathlib.Path(p).read_text(encoding="utf-8")
              except Exception:
                  continue
              for i, ch in enumerate(text):
                  o = ord(ch)
                  if o in singles or any(lo <= o <= hi for lo, hi in ranges):
                      bad.append(f"{p}:{i + 1} U+{o:04X} {ch}")
          if bad:
              print("emoji rule violation:")
              for line in bad:
                  print("  " + line)
              sys.exit(1)
          print("emoji rule passed")
          '

  # Pack the family as npm tarballs, mount them into a REAL DSH instance
  # through the official `dsh plugin --profile <name> add` channel, and render
  # the DSH web UI headlessly (Playwright Chromium) to prove each plugin mounts
  # with no crash markers. Keyless suites use a fake key, not live credentials;
  # authentication and marketplace traffic can still require network access.
  plugin-mount:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install dsh CLI (pinned)
        run: npm install -g "@deepseek-ai/dsh@$(node -p "require('./scripts/workflow-config.json').dshVersion")"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        timeout-minutes: 10
        run: pnpm exec playwright install --with-deps chromium

      - name: All keyless suites (fresh runtime per suite attempt)
        run: pnpm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            artifacts/testing/
          if-no-files-found: ignore
          retention-days: 7

  live-checkpoints:
    name: Opt-in live-model checkpoint test
    # Never expose live credentials to pull requests or arbitrary branch code.
    if: github.event_name == 'workflow_dispatch' && inputs.live_checkpoints && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: live-tests
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install tested DSH CLI
        run: npm install -g "@deepseek-ai/dsh@$(node -p "require('./scripts/workflow-config.json').dshVersion")"
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Live checkpoint capture and rewind
        run: pnpm run test:live -- checkpoints
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DSH_TELEMETRY_DISABLED: '1'
      - name: Upload private live-test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: live-checkpoints-diagnostics
          path: artifacts/testing/
          retention-days: 3
          if-no-files-found: ignore

# bundle patch for the checkpoints plugin: inserts its plugin row into the profile
# roster. Applied as a profile bundle layer (the `dsh.bundle.patch` manifest
# field); install with
# `dsh plugin --profile <name> add link:<repo>/packages/dsh-next-checkpoints`.
- insert:
    - id: dsh-next-checkpoints
      name: '@dsh-next/dsh-next-checkpoints'

# bundle patch for the cc-plugins plugin: inserts its plugin row into the profile
# roster. Applied as a profile bundle layer (the `dsh.bundle.patch` manifest
# field); install with
# `dsh plugin --profile <name> add link:<repo>/packages/dsh-next-cc-plugins`.
- insert:
    - id: dsh-next-cc-plugins
      name: '@dsh-next/dsh-next-cc-plugins'

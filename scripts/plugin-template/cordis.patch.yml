# bundle patch for the __NAME__ plugin: inserts its plugin row into the profile
# roster. Applied as a profile bundle layer (the `dsh.bundle.patch` manifest
# field); install with
# `dsh plugin --profile <name> add link:<repo>/packages/dsh-next-__NAME__`.
- insert:
    - id: dsh-next-__NAME__
      name: '@dsh-next/dsh-next-__NAME__'
